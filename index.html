<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小侦探" />
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
    <title>小侦探</title>
    <script>
      // iPad 上看不到控制台：脚本出错或没启动时，把原因和浏览器版本直接显示在屏幕上
      (function () {
        function show(msg) {
          var box = document.getElementById('boot-error');
          if (!box) {
            box = document.createElement('pre');
            box.id = 'boot-error';
            box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:999;margin:0;padding:12px;background:#fff3f0;color:#a12;border:2px solid #e88;border-radius:12px;font:14px/1.5 monospace;white-space:pre-wrap;max-height:60vh;overflow:auto';
            (document.body || document.documentElement).appendChild(box);
          }
          box.textContent += msg + '\n';
        }
        window.addEventListener('error', function (e) {
          show('出错：' + (e.message || e) + (e.filename ? '\n位置：' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('出错（Promise）：' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
        });
        setTimeout(function () {
          var app = document.getElementById('app');
          if (app && !app.firstChild) show('游戏脚本没有启动。\n浏览器：' + navigator.userAgent);
        }, 4000);
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DY8qPywI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BbC1YGI6.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="app"></div>
  </body>
</html>
